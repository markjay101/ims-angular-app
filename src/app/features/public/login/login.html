<div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-8">
    <div class="text-center">
      <h1 class="text-3xl font-bold text-slate-900">IMS Admin Portal</h1>
      <p class="text-slate-500 mt-2">Please sign in to your account</p>
    </div>

    @if (errorMessage()) {
      <div
        class="p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm animate-in fade-in slide-in-from-top-1"
      >
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4 mb-3">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input
          formControlName="username"
          type="text"
          [class.border-red-300]="
            loginForm.get('username')?.touched && loginForm.get('username')?.invalid
          "
          class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          placeholder="Enter your username"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input
          formControlName="password"
          type="password"
          [class.border-red-300]="
            loginForm.get('password')?.touched && loginForm.get('password')?.invalid
          "
          class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoggingIn()"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-blue-200 flex items-center justify-center gap-2"
      >
        @if (isLoggingIn()) {
          <lucide-icon name="loader-circle" class="animate-spin h-5 w-5 text-white"></lucide-icon>
          Authenticating...
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="text-center text-sm">
      <a href="#" class="text-blue-600 hover:underline">Forgot password</a>
    </div>
  </div>
</div>
