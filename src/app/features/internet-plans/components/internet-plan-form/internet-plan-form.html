<div class="flex flex-col h-full">
  <div class="flex-1 overflow-y-auto p-6">
    <form [formGroup]="internetPlanForm" class="space-y-6">
      <div class="space-y-1">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 ml-1"
          >Name</label
        >
        <input
          formControlName="name"
          type="text"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-900 outline-none transition-all"
          placeholder="e.q. Fiber Unli Plan 1699"
        />
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 ml-1"
          >Description</label
        >
        <textarea
          formControlName="description"
          rows="4"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-900 outline-none transition-all text-slate-700"
          placeholder="Enter plan details..."
        ></textarea>
      </div>

      <div class="space-y-1">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400"
          >Speed (Mbps)</label
        >
        <input
          type="number"
          formControlName="speedMbps"
          min="1"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-100 focus:border-blue-900 outline-none"
        />

        @if (
          internetPlanForm.get('speedMbps')?.touched &&
          internetPlanForm.get('speedMbps')?.errors?.['min']
        ) {
          <span class="text-xs text-red-500 ml-1">Speed must be at least 1 Mbps</span>
        }
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Price</label>
        <input
          type="number"
          formControlName="price"
          min="0"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-100 focus:border-blue-900 outline-none"
        />
      </div>
    </form>
  </div>

  <div class="flex gap-3 justify-end pb-6 pr-6">
    <button
      type="button"
      (click)="onCancel.emit()"
      class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold rounded-lg transition-all active:scale-95"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="submit()"
      [disabled]="internetPlanForm.invalid"
      class="flex gap-1 px-4 py-2 bg-blue-800 hover:bg-blue-900 text-white text-sm font-semibold rounded-lg shadow-md shadow-blue-200 disabled:opacity-50 transition-all active:scale-95"
    >
      @if (isSaving()) {
        <lucide-icon name="loader-circle" class="animate-spin h-5 w-5 text-white"></lucide-icon>
        Saving...
      } @else {
        Save
      }
    </button>
  </div>
</div>
