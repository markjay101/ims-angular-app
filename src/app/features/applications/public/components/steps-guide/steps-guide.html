<div class="rounded-xl border text-card-foreground shadow border-slate-200 bg-white">
  <div class="flex flex-col space-y-1.5 p-6">
    <div class="font-semibold text-[18px]">What Happens Next?</div>
  </div>
  <div class="p-6 pt-0 space-y-4">
    <div class="flex gap-3">
      <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center shrink-0">
        <span class="text-sm font-bold text-blue-600">1</span>
      </div>
      <div>
        <h4 class="font-medium text-slate-900 text-sm">Application Review</h4>
        <p class="text-xs text-slate-600 mt-1">We'll review your application within 24-48 hours</p>
      </div>
    </div>
    <div class="flex gap-3">
      <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center shrink-0">
        <span class="text-sm font-bold text-blue-600">2</span>
      </div>
      <div>
        <h4 class="font-medium text-slate-900 text-sm">Confirmation Call</h4>
        <p class="text-xs text-slate-600 mt-1">Our team will contact you to confirm details</p>
      </div>
    </div>
    <div class="flex gap-3">
      <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center shrink-0">
        <span class="text-sm font-bold text-blue-600">3</span>
      </div>
      <div>
        <h4 class="font-medium text-slate-900 text-sm">Installation</h4>
        <p class="text-xs text-slate-600 mt-1">We'll schedule your installation date</p>
      </div>
    </div>
    <div class="flex gap-3">
      <div
        class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center shrink-0"
      >
        <lucide-icon name="circle-check-big" [size]="16"></lucide-icon>
      </div>
      <div>
        <h4 class="font-medium text-slate-900 text-sm">Get Connected!</h4>
        <p class="text-xs text-slate-600 mt-1">Start enjoying your internet connection</p>
      </div>
    </div>
  </div>
</div>
