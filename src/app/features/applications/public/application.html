<div class="container px-6 lg:px-0 mx-auto py-10">
  <header class="flex flex-col items-center mb-10">
    <span
      class="flex gap-1 px-2.5 py-1.5 rounded-full text-xs font-semibold border text-nowrap bg-blue-500 text-white"
    >
      <lucide-icon name="cable" [size]="15"></lucide-icon>
      Get connected today
    </span>
    <h1 class="text-center text-[25px] md:text-[40px] font-bold">Apply for Internet Service</h1>
    <p class="text-center text-[14px] md:text-[18px] text-slate-400">
      Fill out the form below to start your application. Our team will review it and contact you
      within 24-48 hours.
    </p>
  </header>

  <div class="flex flex-col lg:flex-row gap-4">
    <app-application-form class="lg:w-2/3" (onSave)="handleSubmit($event)" />
    <div class="lg:w-1/3 flex flex-col gap-4">
      <app-steps-guide />
    </div>
  </div>
</div>
