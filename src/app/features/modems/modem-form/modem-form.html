<div class="flex flex-col h-full">
  <div class="flex-1 overflow-y-auto p-6">
    <form [formGroup]="modemForm" class="space-y-6">
      <div class="space-y-1 group">
        <label
          class="text-[11px] font-bold uppercase tracking-wider text-slate-400 ml-1 group-focus-within:text-slate-900"
          >Model</label
        >
        <input
          formControlName="model"
          type="text"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-100 focus:border-slate-900 outline-none transition-all"
        />
      </div>
      <div class="space-y-1 group">
        <label
          class="text-[11px] font-bold uppercase tracking-wider text-slate-400 ml-1 group-focus-within:text-slate-900"
          >Serial Number</label
        >
        <input
          formControlName="serialNumber"
          type="text"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-100 focus:border-slate-900 outline-none transition-all"
        />
      </div>
      <div class="space-y-1 group">
        <label
          class="text-[11px] font-bold uppercase tracking-wider text-slate-400 ml-1 group-focus-within:text-slate-900"
          >Mac Address</label
        >
        <input
          formControlName="macAddress"
          type="text"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-100 focus:border-slate-900 outline-none transition-all"
        />
      </div>
    </form>
  </div>

  <div class="flex gap-3 justify-end pb-6 pr-6">
    <button
      type="button"
      (click)="onCancel.emit()"
      class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold rounded-lg transition-all active:scale-95"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="submit()"
      [disabled]="modemForm.invalid"
      class="flex gap-1 px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-lg shadow-md shadow-slate-200 disabled:opacity-50 transition-all active:scale-95"
    >
      @if (isSaving()) {
        <lucide-icon name="loader-circle" class="animate-spin h-5 w-5 text-white"></lucide-icon>
        Saving...
      } @else {
        Save
      }
    </button>
  </div>
</div>
