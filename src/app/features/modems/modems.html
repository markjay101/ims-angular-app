<header class="mb-8">
  <h1 class="text-[28px] font-bold">Modem Management</h1>
  <p class="text-slate-400 font-semibold">Manage, track and assign network equipment</p>
</header>

<app-table
  [data]="paginatedModems()"
  [isLoading]="isLoading()"
  [columns]="modemColumns"
  (pageChange)="handlePageChange($event)"
  (searchChange)="handleSearch($event)"
  [columnTemplates]="{
    model: modelTemplate,
    serialNumber: serialNumberAndMacAddressTemplate,
    macAddress: serialNumberAndMacAddressTemplate,
    customer: assignedToTemplate,
    actions: actionsTemplate,
  }"
>
  <button
    tableActions
    (click)="handleAdd()"
    class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-lg shadow-md shadow-slate-400 active:scale-95"
  >
    <lucide-icon name="plus" [size]="18"></lucide-icon>
    <span>Add Modem</span>
  </button>
</app-table>

<ng-template #actionsTemplate let-row="row">
  <button
    (click)="handleEdit(row)"
    class="text-slate-700 hover:bg-slate-50 rounded-md transition-colors"
  >
    <lucide-icon name="pencil" [size]="16"></lucide-icon>
  </button>
</ng-template>

<ng-template #serialNumberAndMacAddressTemplate let-value>
  <div class="flex items-center justify-between bg-slate-50 p-2 rounded-lg border border-slate-300">
    <span class="text-gray-900 font-mono font-bold text-nowrap">{{ value }}</span>
  </div>
</ng-template>

<ng-template #modelTemplate let-value>
  <div class="flex gap-2 items-center">
    <div
      class="rounded-lg h-10 w-10 flex items-center justify-center text-white bg-linear-to-r from-slate-900 to-slate-600"
    >
      <lucide-icon name="router" [size]="16"></lucide-icon>
    </div>
    <span class="font-medium text-slate-900 text-nowrap">
      {{ value }}
    </span>
  </div>
</ng-template>

<app-backdrop [showBackdrop]="isFormOpen()" (closeBackdrop)="isFormOpen.set(false)" />

<app-form-container
  [isFormOpen]="isFormOpen()"
  [formHeader]="selectedModem() ? 'Edit Modem' : 'Add New Modem'"
  [formSubHeader]="'Please fill in the details below'"
  (closeForm)="isFormOpen.set(false)"
>
  <app-modem-form
    inputs
    [isSaving]="isSaving()"
    [modemData]="selectedModem()"
    (onSave)="handleSave($event)"
    (onCancel)="isFormOpen.set(false)"
  />
</app-form-container>

<ng-template #assignedToTemplate let-value>
  @if (value !== null) {
    <div class="flex flex-col">
      <span class="font-medium text-slate-900 text-nowrap"
        >{{ value?.firstName }} {{ value?.lastName }}</span
      >
      <span class="text-xs text-slate-500 text-nowrap">{{ value?.email }}</span>
    </div>
  } @else {
    <span class="text-md text-slate-500 text-bold">-</span>
  }
</ng-template>
