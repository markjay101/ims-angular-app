<div
  class="group relative bg-white rounded-xl border border-slate-200 shadow-sm hover:border-slate-300 hover:shadow-md transition-all duration-300 overflow-hidden cursor-pointer"
>
  <div
    class="absolute z-20 top-2 right-2 opacity-100 sm:inset-0 sm:flex sm:items-center sm:justify-center sm:opacity-0 sm:group-hover:opacity-100 sm:bg-slate-900/40 transition-all duration-300"
  >
    <button
      class="flex items-center justify-center text-white sm:bg-transparent p-3 sm:shadow-none transition-transform active:scale-90"
      (click)="handleEdit(paymentMethod())"
    >
      <lucide-icon name="pencil" [size]="18" class="sm:scale-125"></lucide-icon>
    </button>
  </div>

  <div
    class="h-32 bg-slate-50 flex items-center justify-center overflow-hidden border-b border-slate-100"
  >
    <img
      class="shrink-0 min-w-full min-h-full object-cover transition-all duration-500 group-hover:scale-105"
      [src]="paymentMethodImage()"
      alt="Payment Logo"
    />
  </div>

  <div class="p-4 space-y-3">
    <div class="flex items-center justify-between">
      <span class="text-sm font-bold text-blue-600 uppercase tracking-wider">
        {{ paymentMethod().methodName }}
      </span>
    </div>

    <div class="space-y-1">
      <label class="text-[10px] text-slate-400 uppercase font-semibold">Account Name</label>
      <p class="text-slate-700 font-medium truncate">{{ paymentMethod().accountName }}</p>
    </div>

    <div class="space-y-1">
      <label class="text-[10px] text-slate-400 uppercase font-semibold">Account Number</label>
      <div
        class="flex items-center justify-between bg-slate-50 p-2 rounded-lg border border-slate-100"
      >
        <span class="text-slate-900 font-mono font-bold">{{ paymentMethod().accountNumber }}</span>
      </div>
    </div>
  </div>
</div>
