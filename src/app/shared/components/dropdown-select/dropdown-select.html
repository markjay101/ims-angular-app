<div class="relative w-full group">
  <button
    type="button"
    [disabled]="disabled()"
    (click)="toggle()"
    class="w-full flex items-center justify-between pl-10 pr-10 py-3 rounded-xl transition-all outline-none font-medium text-left disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed disabled:border-slate-200 bg-slate-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500 text-slate-700"
  >
    <span
      class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 group-focus-within:text-blue-500"
    >
      <lucide-icon [name]="iconName()" [size]="18"></lucide-icon>
    </span>

    <span class="truncate">{{ getDisplayValue() || placeholder() }}</span>

    <span
      class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400"
    >
      @if (isProcessingSelection()) {
        <lucide-icon name="loader-circle" [size]="18" class="animate-spin"></lucide-icon>
      } @else {
        <lucide-icon
          name="chevron-down"
          [size]="18"
          class="transition-transform duration-200"
          [class.rotate-180]="isOptionsOpen()"
        ></lucide-icon>
      }
    </span>
  </button>

  @if (isOptionsOpen()) {
    <div
      class="absolute z-50 w-full mt-2 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200"
    >
      @if (isSearchable()) {
        <div class="p-2 border-b border-slate-100 bg-slate-50/50">
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"
            >
              <lucide-icon name="search" [size]="18"></lucide-icon>
            </span>
            <input
              (input)="handleSearch($event)"
              (click)="$event.stopPropagation()"
              type="text"
              placeholder="Search..."
              class="w-full pl-9 pr-10 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-100"
            />
            @if (isLoading()) {
              <div class="absolute right-3 top-1/2 -translate-y-1/2">
                <div
                  class="animate-spin h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full"
                ></div>
              </div>
            }
          </div>
        </div>
      }

      <div class="max-h-60 overflow-y-auto py-1">
        @for (option of options(); track option.id) {
          <button
            type="button"
            (click)="handleSelect(option)"
            class="w-full px-4 py-3 text-sm text-left transition-colors flex items-center justify-between hover:bg-slate-50 group"
          >
            @if (itemTemplate) {
              <ng-container
                [ngTemplateOutlet]="itemTemplate"
                [ngTemplateOutletContext]="{ $implicit: option }"
              ></ng-container>
            } @else {
              <span class="truncate">{{
                typeof option === 'string' ? option : option[displayKey()]
              }}</span>
            }

            @if (selectedItem()?.id === option.id) {
              <lucide-icon name="check" [size]="14" class="text-blue-600"></lucide-icon>
            }
          </button>
        } @empty {
          @if (!isLoading()) {
            <div class="px-4 py-6 text-sm text-center text-slate-400">No results found</div>
          }
        }
      </div>
    </div>

    <div class="fixed inset-0 z-40" (click)="isOptionsOpen.set(false)"></div>
  }
</div>
