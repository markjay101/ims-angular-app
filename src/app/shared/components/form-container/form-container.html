<div
  class="fixed inset-y-0 right-0 w-full sm:max-w-md bg-white shadow-2xl z-50 transition-transform duration-300 border-l border-slate-100 translate-x-full"
  [class.translate-x-0]="isFormOpen()"
  [class.translate-x-full]="!isFormOpen()"
>
  <div class="flex flex-col h-full">
    <div
      class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50"
    >
      <div>
        <h2 class="text-xl font-bold text-slate-800">
          {{ formHeader() }}
        </h2>
        <p class="text-xs text-slate-500 font-medium">{{ formSubHeader() }}</p>
      </div>
      <button (click)="closeForm.emit()" class="p-2">
        <lucide-icon
          name="x"
          [size]="20"
          class="text-slate-400 hover:text-black transition-colors"
        ></lucide-icon>
      </button>
    </div>
    <ng-content select="[form]"></ng-content>
  </div>
</div>
